<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Eventos JavaScript</title>
</head>
<body>
   <h1>Eventos com JavaScript</h1>

   <button id="meuBotao">Clique Aqui!</button>

   <script>
      function clicouBotao() {
         console.log("Você clicou no botão!");
      }

      //adicionar um manipulador de eventoi do clique do botão 
      let botao = document.getElementById("meuBotao");
      //addEventListener 
      botao.addEventListener("click", clicouBotao); 

      //remover manipulador apos 5 segundos
       setTimeout(function (){
         botao.removeEventListener("click", clicouBotao);
         console.log("Evento removido apos 5 segundos")
       }, 5000);

   </script> 
</body>
</html>
